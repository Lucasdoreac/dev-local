# LabTechUDF — ambiente local do produto Reservas (dev/staging).
#
#   cd ~/LABTECH/dev-local && docker compose up -d --build   # sobe tudo
#   ./smoke.sh                                               # prova: reserva + aprovação
#   docker compose down                                      # derruba (volumes ficam)
#
# Este diretório é o harness local integrado do produto Reservas.
# Credenciais locais geradas em minio.env / internal.env (fora de qualquer repo).
# Em FLASK_ENV=development nenhum email sai: o python-services devolve o HTML.
#
# ESCOPO (decidido 2026-09-23, após auditoria independente — ver
# reports/gaps-2026-09-23.md e a pergunta em aberto no doc de status): só o
# produto Reservas (python-services + shared-resources + frontend React), que
# é o único bloco com chamadas de código reais entre os serviços. NÃO inclui:
#   - java-services (Events API + Postgres + Keycloak): repo ARQUIVADO no
#     GitHub, código parado desde jun/2024, nada no Reservas o chama. Se
#     precisar dele de novo, `docker compose -f compose.yaml
#     -f ../java-services/compose.yaml up -d` continua funcionando — o
#     arquivo dele não foi tocado.
#   - CoOps (dashboard): fork de ferramenta de métricas do GitHub sem nenhuma
#     chamada de código para o produto Reservas. Roda pelo compose próprio em
#     CoOps/dashboard, se precisar.
name: labtech-dev

services:
  mongo:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    # 8.0: linha de suporte longo (a do Atlas). Subiu do 7 no mesmo volume (FCV 7.0 → 8.0).
    # amd64 child of the official 8.0 multi-platform index.
    image: mongo:8.0@sha256:a70d9916fd916ddfdf6fd8552784c599eb26f88c59951c7bcdc50abd158e8be7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      retries: 20

  redis:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    # amd64 child of the official redis:8.10.1 multi-platform index.
    image: redis:8.10.1@sha256:5edb5f1591cd35076057573171f40e0439ec7fbbb38e04d56c0efae810d99d47  # latest stable patch with security fixes (2026-08)
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]

  # Nome SEM "_": o MinIO recusa hostname com underscore (InvalidRequest).
  minio:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    # A Community Edition virou source-only; construir do commit oficial de segurança,
    # sem depender do registry Quay que retorna 401 para esta conta.
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.minio-source
      args:
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
        MINIO_COMMIT: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
    image: labtech-dev-minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: [minio.env]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio_data:/data]

  # Seed de desenvolvimento executado somente se todas as coleções de catálogo
  # estiverem vazias; `docker compose up` nunca pode sobrescrever dados existentes.
  seed:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: mongo:8.0@sha256:a70d9916fd916ddfdf6fd8552784c599eb26f88c59951c7bcdc50abd158e8be7  # mesmas ferramentas (mongorestore) do serviço mongo
    depends_on: {mongo: {condition: service_healthy}}
    volumes:
      - ../scripts/new_collection/labtech.backup.tar.gz:/seed/labtech.backup.tar.gz:ro
      - ./seed-catalog.sh:/dev-local/seed-catalog.sh:ro
    command: ["bash", "/dev-local/seed-catalog.sh"]

  # A pilha local usa Dockerfile.poetry do harness: dependências pelo lock e
  # worktrees montadas em runtime para live-edit. Dockerfiles de API/Auth/Catálogo
  # empacotam imagens em seus workflows; Dockerfile.test-python é o runner isolado.
  # São imagens com ciclos diferentes, não cópias da configuração de dependências.
  auth:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ../shared-resources/auth_service
      dockerfile: ../../dev-local/dockerfiles/Dockerfile.poetry
      args: {APP_DIR: /auth_service}
    restart: unless-stopped
    # redis: cache do login (auth) e do catálogo (internal); sem ele as rotas dão 500.
    depends_on: {seed: {condition: service_completed_successfully}, redis: {condition: service_started}}
    volumes:
      - ../shared-resources/auth_service:/auth_service
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: rooms-reservation-app
      FLASK_ENV: development
      # só em dev: o link de login volta na resposta (tela e scripts de captura o usam)
      AUTH_DEV_RETURN_LINK: "true"
      REDIS_URL: redis://redis:6379/0
      REACT_APP: http://127.0.0.1:3000
      # CORS fechado por padrão: além de REACT_APP, só o navegador local e o
      # frontend temporário do E2E (alias fixo do run-tests.sh).
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://labtech-e2e-web:3000
    ports: ["127.0.0.1:5050:5050"]
    command: poetry run gunicorn -w 2 -b 0.0.0.0:5050 main:auth_app

  internal:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ../shared-resources/internal_apis
      dockerfile: ../../dev-local/dockerfiles/Dockerfile.poetry
      args: {APP_DIR: /internal_apis}
    restart: unless-stopped
    # redis: cache do login (auth) e do catálogo (internal); sem ele as rotas dão 500.
    depends_on: {seed: {condition: service_completed_successfully}, redis: {condition: service_started}}
    volumes: [../shared-resources/internal_apis:/internal_apis]
    env_file: [internal.env]
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: rooms-reservation-app
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:5081:5081"]
    command: sh -c "PYTHONPATH=src poetry run gunicorn -w 2 -b 0.0.0.0:5081 main:internal_apis"

  api:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ../python-services
      dockerfile: ../dev-local/dockerfiles/Dockerfile.poetry
      args: {APP_DIR: /python-services}
    restart: unless-stopped
    depends_on: [auth, internal, minio]
    volumes:
      - ../python-services:/python-services
    # internal.env traz INTERNAL_API_KEY: a chave que o api manda ao catálogo
    env_file: [minio.env, internal.env]
    environment:
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DATABASE: rooms-reservation-app
      FLASK_ENV: development
      # Único interruptor de envio de e-mail (src/settings.py). Explícito aqui
      # mesmo sendo o padrão: o dev-local nunca deve mandar e-mail de verdade.
      EMAIL_DRY_RUN: "true"
      # Sobrepõem o .env do repo (que aponta para os nomes de container antigos).
      URL_AUTH: http://auth:5050
      URL_graph: http://internal:5081/graphql/
      URL_restapi: http://internal:5081/restapi
      MINIO_URL: http://minio:9000
      # link "editar o evento" no e-mail de pedido de mudança (mesma origem do REACT_APP do auth)
      FRONTEND_URL: http://127.0.0.1:3000
      # CORS fechado por padrão: além de FRONTEND_URL, só o navegador local e o
      # frontend temporário do E2E (alias fixo do run-tests.sh).
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://labtech-e2e-web:3000
    ports: ["5000:5000"]
    # O client MinIO do python-services espera MINIO_ACCESS_KEY/SECRET_KEY;
    # minio.env só define MINIO_ROOT_USER/PASSWORD (o que o container do
    # MinIO usa). Remapeia antes de subir o gunicorn do Dockerfile.
    command: >-
      sh -c "export MINIO_ACCESS_KEY=$$MINIO_ROOT_USER MINIO_SECRET_KEY=$$MINIO_ROOT_PASSWORD &&
      PYTHONPATH=src poetry run gunicorn -w 2 -b 0.0.0.0:5000 main:reservation_app"

  # Frontends com node_modules próprio (volume): o do Mac tem binário darwin.
  # React Router Framework em modo SPA; nenhuma renderização SSR em runtime.
  reservas:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: Dockerfile.reservas
    image: labtech-dev-reservas-web:26.10.0
    restart: unless-stopped
    depends_on: [api]
    working_dir: /app
    volumes: [../interfaces-usuario/reservas:/app, reservas_node_modules:/app/node_modules]
    environment:
      VITE_API_BASE_URL: http://localhost:5000
      CHOKIDAR_USEPOLLING: "true"
    ports: ["127.0.0.1:3000:3000"]
    command: sh -c "yarn install --frozen-lockfile --non-interactive && yarn start"

  # Alocação de Professores (repo teachers-allocation): app à parte do Reservas,
  # com Postgres próprio, login próprio e ids próprios (ver
  # reports/gap-reservas-2026-09-24.md). Portas: API 5002, frontend 3001 (o
  # frontend usa REACT_APP_API_URL; antes a URL era fixa em localhost:5000, que
  # é a API do Reservas). Dados 100% sintéticos (backend/seed_dev.py).
  alocacao-db:
    profiles: [alocacao]
    # Postgres 18: a imagem grava em /var/lib/postgresql/18/docker, então o volume
    # vai em /var/lib/postgresql (em .../data os dados ficariam fora do volume).
    # Migrado do 17 com pg-upgrade.sh; volumes antigos (13, 17) ficam até o dono decidir.
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: resource_allocation
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password  # só dev local (mesmo valor do compose do repo)
    volumes: [alocacao_pg18:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d resource_allocation"]
      interval: 5s
      retries: 20

  alocacao-api:
    profiles: [alocacao]
    build: {context: ../teachers-allocation/backend}
    image: labtech-dev-alocacao-api
    restart: unless-stopped
    depends_on: {alocacao-db: {condition: service_healthy}}
    volumes: [../teachers-allocation/backend:/app]
    environment:
      SQLALCHEMY_DATABASE_URI: postgresql://user:password@alocacao-db:5432/resource_allocation
      SQLALCHEMY_TRACK_MODIFICATIONS: "False"
      SECRET_KEY: dev-local-nao-usar-em-producao
    ports: ["127.0.0.1:5002:5000"]

  alocacao-seed:
    profiles: [alocacao]
    build: {context: ../teachers-allocation/backend}
    image: labtech-dev-alocacao-api
    depends_on: {alocacao-api: {condition: service_started}, alocacao-db: {condition: service_healthy}}
    working_dir: /app
    volumes: [../teachers-allocation/backend:/app]
    environment:
      SQLALCHEMY_DATABASE_URI: postgresql://user:password@alocacao-db:5432/resource_allocation
      SECRET_KEY: dev-local-nao-usar-em-producao
    command: python seed_dev.py
    restart: "no"

  alocacao-web:
    profiles: [alocacao]
    image: node:24  # era 22 (só manutenção desde 10/2025)
    restart: unless-stopped
    depends_on: [alocacao-api]
    working_dir: /app
    volumes: [../teachers-allocation/frontend:/app, alocacao_web_node_modules:/app/node_modules]
    environment:
      REACT_APP_API_URL: http://127.0.0.1:5002
      # Em instalação limpa o lint do CRA falha ("jest/globals is unknown") e
      # derruba a compilação; desligado só aqui, no dev local (lacuna do repo).
      DISABLE_ESLINT_PLUGIN: "true"
      BROWSER: none
      HOST: 0.0.0.0
      PORT: "3000"
      WATCHPACK_POLLING: "true"
    ports: ["127.0.0.1:3001:3000"]
    command: sh -c "npm ci --no-audit --no-fund --loglevel=error && npm start"  # lock versionado desde 25/09

  # Eventos (Java + Angular, arquivados) e Hi.Events (fork sem uso) saíram em 25/09/2026:
  # produto único = Reservas (+ Alocação). Voltam pelo histórico do git se precisar avaliar.

volumes:
  mongo_data: {}
  redis_data: {}
  minio_data: {}
  reservas_node_modules: {}
  alocacao_pgdata: {}  # Postgres 13, sem uso desde 25/09/2026 (não apagar sem o dono)
  alocacao_pgdata17: {}  # Postgres 17, sem uso desde 25/09/2026 (não apagar sem o dono)
  alocacao_pg18: {}
  alocacao_web_node_modules: {}
# Volumes labtech-dev_eventos_* e labtech-dev_hievents_* ficaram sem serviço em 25/09/2026
# (dados sintéticos): continuam no Docker até o dono apagar.
